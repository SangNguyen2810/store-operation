# The whole stack (run from the repo root with `-f infra/docker-compose.yml`, which `make up` does): Redis, the API, the gateway and the web app. Pagila keeps its own compose file in
# its own repo; the API reaches it on the host (override with DOCKER_DATABASE_URL).
#
#   make up      builds and starts everything; the app is at http://localhost:3000
#   make down    stops it
#
# `make redis-up` starts just Redis, for running the API and gateway directly with `make dev`
# (REDIS_URL=redis://localhost:6379). If 6379 is taken, pick another host port:
# `REDIS_PORT=6380 make redis-up`, and use REDIS_URL=redis://localhost:6380.
name: store-operation

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: app/api/Dockerfile
    environment:
      ADDR: ":8081"
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://postgres:123456@host.docker.internal:5432/postgres}
      REDIS_URL: redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: ../app/gateway
    environment:
      ADDR: ":8080"
      UPSTREAM_URL: http://api:8081
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ../app/web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy
