# The whole stack (run from the repo root with `-f infra/docker-compose.yml`, which `make up` does): Redis, the redis service, the stores, ranges and analytics services, the gateway and the web app.
# Pagila keeps its own compose file in its own repo; stores and analytics reach it on the host (override with DOCKER_DATABASE_URL).
#
#   make up      builds and starts everything but the web app; the gateway is http://localhost:8080 and `make dev` runs the web app
#   make up-all  also builds and starts the web app, at http://localhost:3000
#   make down    stops it
#
# Redis is published on host port 6380 (not 6379, which a local Redis often holds); change it with REDIS_PORT.
# `make redis-up` starts just Redis, for running the redis service directly with `make dev-redis`
# (REDIS_URL=redis://localhost:6380).
name: store-operation

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Our code in front of Redis: a small key-value HTTP API. Reachable only on the compose network.
  redis-service:
    build: ../app/redis
    environment:
      ADDR: ":8082"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Serves GET /api/kpis, /api/revenue, /api/top/films and /api/meta.
  # It asks the ranges service which date ranges are allowed, and uses the built-in list when that service is down, so ranges is only a start-up order.
  analytics:
    build: ../app/analytics
    environment:
      ADDR: ":8084"
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://postgres:123456@host.docker.internal:5432/postgres}
      CACHE_URL: http://redis-service:8082
      RANGES_URL: http://ranges:8083
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis-service:
        condition: service_healthy
      ranges:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8084/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Serves GET /api/stores.
  stores:
    build: ../app/stores
    environment:
      ADDR: ":8081"
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://postgres:123456@host.docker.internal:5432/postgres}
      CACHE_URL: http://redis-service:8082
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Serves GET /api/presets.
  ranges:
    build: ../app/ranges
    environment:
      ADDR: ":8083"
      CACHE_URL: http://redis-service:8082
    depends_on:
      redis-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: ../app/gateway
    environment:
      ADDR: ":8080"
      # Everything not claimed below, /healthz included, goes to analytics.
      UPSTREAM_URL: http://analytics:8084
      ROUTES: /api/stores=http://stores:8081,/api/presets=http://ranges:8083
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      analytics:
        condition: service_healthy
      stores:
        condition: service_healthy
      ranges:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ../app/web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy
